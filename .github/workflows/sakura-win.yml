name: SAKURA Windows x64 (fast)

# SAKURA-Remote 専用の高速ビルド。
# 全プラットフォーム(Mac/Linux/Android/iOS/sciter/msi/署名)を省き、
# Windows x86_64 flutter の unsigned 成果物のみを生成する。
# 配布用 Setup.exe はこの成果物をローカルの Inno Setup で梱包する運用。

on:
  workflow_dispatch:
  workflow_call:

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.6"
  UPLOAD_ARTIFACT: "true"
  SIGN_BASE_URL: "-2"
  # 自社サーバー/Keyをビルドに焼き込む（toml適用に依存せず必ず反映させる）
  RENDEZVOUS_SERVER: "116.58.164.244"
  RS_PUB_KEY: "CiBjNf1UarFy7pU5OhHoAVQUG0wvvOLriqycc4PMPd8="
  API_SERVER: ""

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-for-windows-flutter:
    name: ${{ matrix.job.target }}
    needs: [generate-bridge]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              vcpkg-triplet: x64-windows-static,
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          Move-Item -LiteralPath .\rustdesk\rustdesk.exe -Destination .\rustdesk\SAKURA-Remote.exe

      - name: 接続不変条件ゲート (post-build)
        shell: pwsh
        run: |
          # 焼き込み(サーバー/鍵)・updater guard・ブランディングを成果物で検査。
          # 違反があれば upload せずにビルドを失敗させる(手動起動含む全ビルドを保護)。
          & ./installer/check_network_invariants.ps1 -SourceDir . -ArtifactDir ./rustdesk
          if ($LASTEXITCODE -ne 0) { throw "接続不変条件ゲート違反: 認証/中継サーバー・鍵の焼き込みが失われています。配信不可。" }

      - name: Validate Windows distribution profile
        shell: pwsh
        run: |
          & ./installer/test_windows_distribution_profile.ps1 -SourceDir . -ArtifactDir ./rustdesk
          if ($LASTEXITCODE -ne 0) { throw "Windows distribution profile validation failed." }

      - name: Upload unsigned basic package
        uses: actions/upload-artifact@master
        with:
          name: SAKURA-Remote-basic-windows-${{ matrix.job.arch }}
          path: rustdesk
