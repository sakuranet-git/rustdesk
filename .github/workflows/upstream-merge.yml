name: Upstream Merge (RustDesk新版を自動取り込み)

# RustDesk本体の新版tagを upstream-merge/<tag> 専用ブランチへ自動マージし、
# 自社サーバー/鍵の焼き込みを再適用→高速ビルド(branch指定)→接続不変条件ゲート(ビルド内post-build)→
# Issueで READY 通知する。本流 sakura-remote への反映・本番配信は人間が最終承認する(自動でやらない)。
#
# 前提: cross-repo push 用トークン secret SAKURA_BOT_TOKEN が必要。
#   sakuranet-git/rustdesk : contents/actions/issues write
#   sakuranet-git/hbb_common: contents write
#   (GitHub仕様上オーナーのみ作成可・未設定時は明示的にfailする)

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "取り込む RustDesk のタグ (例 1.4.9)"
        required: true
        type: string

concurrency:
  group: upstream-merge-${{ inputs.upstream_tag }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write

env:
  TAG: ${{ inputs.upstream_tag }}
  BRANCH: upstream-merge/${{ inputs.upstream_tag }}
  FORK: sakuranet-git/rustdesk
  HBB: sakuranet-git/hbb_common

jobs:
  merge-build-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: トークン存在チェック (未設定なら明示fail)
        env:
          BOT: ${{ secrets.SAKURA_BOT_TOKEN }}
        run: |
          if [ -z "${BOT:-}" ]; then
            echo "::error::SAKURA_BOT_TOKEN 未設定。cross-repo push できません。オーナーが secret を登録してください。"
            exit 1
          fi

      - name: Checkout (sakura-remote + submodules)
        uses: actions/checkout@v4
        with:
          ref: sakura-remote
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.SAKURA_BOT_TOKEN }}

      - name: git identity / token remotes
        env:
          BOT: ${{ secrets.SAKURA_BOT_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "sakura-bot"
          git config user.email "ai.sakuranet@gmail.com"
          git remote set-url origin "https://x-access-token:${BOT}@github.com/${FORK}.git"
          git remote add upstream "https://github.com/rustdesk/rustdesk.git" || true
          git -C libs/hbb_common remote set-url origin "https://x-access-token:${BOT}@github.com/${HBB}.git"
          git -C libs/hbb_common remote add upstream "https://github.com/rustdesk/hbb_common.git" || true

      - name: fetch upstream / origin + tag実在確認
        run: |
          set -euo pipefail
          git fetch upstream --tags --force --quiet
          git fetch origin --quiet
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::upstream tag が存在しません: ${TAG}"; exit 1
          fi

      - name: tag が指す hbb_common SHA 取得 (tag名に依存しない)
        id: hbbsha
        run: |
          set -euo pipefail
          SHA=$(git ls-tree "${TAG}" libs/hbb_common | sed -n 's/^160000 commit \([0-9a-f]\{40\}\).*/\1/p')
          if [ -z "$SHA" ]; then echo "::error::hbb_common SHA取得失敗"; exit 1; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "hbb_common SHA = $SHA"

      - name: hbb_common マージ + 不変条件再適用 + push
        id: hbbmerge
        env:
          SHA: ${{ steps.hbbsha.outputs.sha }}
        run: |
          set -euo pipefail
          cd libs/hbb_common
          git fetch origin --quiet
          # detached HEAD 対策: 必ず origin/sakura-remote から明示 checkout
          git checkout -B sakura-remote origin/sakura-remote
          git fetch upstream "$SHA" --quiet || git fetch upstream --quiet
          git checkout -B "${BRANCH}" sakura-remote
          if ! git merge --no-ff --no-edit "$SHA"; then
            { echo "conflict=1"; echo "files<<EOF"; git diff --name-only --diff-filter=U; echo "EOF"; } >> "$GITHUB_OUTPUT"
            git merge --abort || true
            echo "::error::hbb_common マージ競合"; exit 1
          fi
          # 不変条件 精密再適用(sed禁止・定数行のみ・python)
          python3 - <<'PY'
          import re
          p='src/config.rs'
          s=open(p,encoding='utf-8').read()
          s=re.sub(r'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[[^\]]*\];',
                   'pub const RENDEZVOUS_SERVERS: &[&str] = &["116.58.164.244"];', s)
          s=re.sub(r'pub const RS_PUB_KEY: &str = "[^"]*";',
                   'pub const RS_PUB_KEY: &str = "CiBjNf1UarFy7pU5OhHoAVQUG0wvvOLriqycc4PMPd8=";', s)
          open(p,'w',encoding='utf-8').write(s)
          PY
          if ! git diff --quiet; then
            git add src/config.rs
            git commit -m "fix: 上流マージ後に自社rendezvous/鍵を再適用"
          fi
          git push origin "${BRANCH}" --force-with-lease
          echo "NEW_HBB=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: rustdesk(親) マージ + submodule pointer更新 + push
        id: parentmerge
        run: |
          set -euo pipefail
          git checkout -B "${BRANCH}" sakura-remote
          if ! git merge --no-ff --no-edit "${TAG}"; then
            OTHER=$(git diff --name-only --diff-filter=U | grep -v '^libs/hbb_common$' || true)
            if [ -n "$OTHER" ]; then
              { echo "conflict=1"; echo "files<<EOF"; echo "$OTHER"; echo "EOF"; } >> "$GITHUB_OUTPUT"
              git merge --abort || true
              echo "::error::rustdesk マージ競合"; exit 1
            fi
          fi
          git -C libs/hbb_common checkout "${BRANCH}"
          git add libs/hbb_common
          git commit --no-edit -m "chore: upstream ${TAG} マージ + hbb_common(${NEW_HBB}) 反映" || true
          git push origin "${BRANCH}" --force-with-lease
          # race-safe な run特定用に branch head SHA を記録
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: ソース検証ゲート (Layer1/2)
        shell: pwsh
        run: |
          & ./installer/check_network_invariants.ps1 -SourceDir .
          if ($LASTEXITCODE -ne 0) { throw "ソース検証ゲート違反(焼き込み/guard)" }

      - name: 高速ビルドを branch で起動して完了待ち (post-build gate含む)
        id: build
        env:
          GH_TOKEN: ${{ secrets.SAKURA_BOT_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run "SAKURA Windows x64 (fast)" --repo "$FORK" --ref "${BRANCH}"
          # race-safe: branch head SHA と一致する run を待って特定する(並列/直前runの取り違え防止・Codex指摘)
          RID=""
          for i in $(seq 1 20); do
            sleep 10
            RID=$(gh run list --repo "$FORK" --workflow "sakura-win.yml" --branch "${BRANCH}" --event workflow_dispatch \
                    --json databaseId,headSha,createdAt --jq "[.[] | select(.headSha==\"${HEAD_SHA}\")] | sort_by(.createdAt) | last | .databaseId // empty")
            [ -n "$RID" ] && break
          done
          if [ -z "$RID" ]; then echo "::error::ビルドrunを特定できません(headSha=${HEAD_SHA})"; exit 1; fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "ビルド run: ${GITHUB_SERVER_URL}/${FORK}/actions/runs/$RID"
          # 完了待ち。post-build gate(焼き込み検証)が落ちればここも非0で失敗する。
          gh run watch "$RID" --repo "$FORK" --exit-status

      - name: READY通知
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ steps.build.outputs.run_id }}
        run: |
          set -euo pipefail
          gh label create upstream-merge-ok --repo "$GITHUB_REPOSITORY" --color 0E8A16 --description "上流マージ検証OK" 2>/dev/null || true
          BODY="RustDesk ${TAG} を取り込み、ビルド+接続不変条件ゲート(焼き込み/guard)までPASSしました。

          - rustdesk / hbb_common ブランチ: ${BRANCH}
          - hbb_common SHA: ${NEW_HBB}
          - Windows成果物 run: ${GITHUB_SERVER_URL}/${FORK}/actions/runs/${RID}
          - 本流 sakura-remote へは **未反映** / 本番サーバーへは **未配信**

          ## 次に人間が実行
          1. ブランチ ${BRANCH} を確認
          2. \`pwsh scripts/release-from-ci.ps1 -RunId ${RID} -UpstreamVersion ${TAG}\`
          3. 問題なければ ${BRANCH} を sakura-remote へマージし \`.sakura-upstream\` を ${TAG} に更新
          4. WinSCPで Setup.exe→version.json の順にアップロード"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "[READY] RustDesk ${TAG} SAKURA merge verified" --label upstream-merge-ok --body "$BODY"

      - name: 失敗時 Issue通知
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh label create upstream-merge-failed --repo "$GITHUB_REPOSITORY" --color B60205 --description "上流マージ失敗" 2>/dev/null || true
          BODY="upstream ${TAG} の取り込みでエラー。ブランチ: ${BRANCH}
          workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          競合(hbb): ${{ steps.hbbmerge.outputs.files }}
          競合(親): ${{ steps.parentmerge.outputs.files }}
          → 人間が競合解決 or 検証NG原因を確認。本流・本番へは未反映です。"
          EXIST=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label upstream-merge-failed --search "${TAG} in:title" --json number --jq 'length')
          if [ "$EXIST" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "[FAILED] RustDesk ${TAG} 取り込み失敗" --label upstream-merge-failed --body "$BODY"
          fi
